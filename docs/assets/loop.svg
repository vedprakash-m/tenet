<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-labelledby="t d">
  <title id="t">The Tenet loop</title>
  <desc id="d">A request goes through intent, a failing test, implementation, checks, review and one stated outcome. A local kernel records the binding facts underneath.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker>
  </defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#24292f}
    .box{fill:#ffffff;stroke:#8c959f;stroke-width:1.5}
    .hi{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}
    .out{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}
    .k{fill:#f6f8fa;stroke:#8c959f;stroke-width:1.5;stroke-dasharray:5 4}
    .n{font-size:14px;font-weight:600;text-anchor:middle}
    .s{font-size:11.5px;text-anchor:middle;fill:#57606a}
    .l{stroke:#57606a;stroke-width:1.5;fill:none}
  </style>
  <rect width="880" height="250" rx="12" fill="#f6f8fa" opacity="0"/>
  <g>
    <rect class="hi" x="14" y="28" width="116" height="84" rx="10"/><text class="n" x="72" y="62">Your request</text><text class="s" x="72" y="82">/tenet fix: …</text>
    <rect class="box" x="162" y="28" width="116" height="84" rx="10"/><text class="n" x="220" y="62">Intent</text><text class="s" x="220" y="82">examples and rules</text>
    <rect class="box" x="310" y="28" width="116" height="84" rx="10"/><text class="n" x="368" y="62">Failing test</text><text class="s" x="368" y="82">written first</text>
    <rect class="box" x="458" y="28" width="116" height="84" rx="10"/><text class="n" x="516" y="62">Implement</text><text class="s" x="516" y="82">on a work branch</text>
    <rect class="box" x="606" y="28" width="116" height="84" rx="10"/><text class="n" x="664" y="62">Checks + review</text><text class="s" x="664" y="82">receipts, a reviewer</text>
    <rect class="out" x="754" y="28" width="116" height="84" rx="10"/><text class="n" x="812" y="62">One outcome</text><text class="s" x="812" y="82">checked-local, …</text>
  </g>
  <g>
    <line class="l" x1="130" y1="70" x2="160" y2="70" marker-end="url(#a)"/>
    <line class="l" x1="278" y1="70" x2="308" y2="70" marker-end="url(#a)"/>
    <line class="l" x1="426" y1="70" x2="456" y2="70" marker-end="url(#a)"/>
    <line class="l" x1="574" y1="70" x2="604" y2="70" marker-end="url(#a)"/>
    <line class="l" x1="722" y1="70" x2="752" y2="70" marker-end="url(#a)"/>
  </g>
  <rect class="k" x="14" y="150" width="856" height="78" rx="10"/>
  <text class="n" x="442" y="178" style="text-anchor:middle">The kernel: a small local program that writes the binding facts</text>
  <text class="s" x="442" y="202">check receipts tied to exact files   ·   the outcome label   ·   counters   ·   who owns what</text>
  <text class="s" x="442" y="218">Agents do the work and explain it. They cannot relabel what the kernel recorded.</text>
  <g><line class="l" x1="220" y1="112" x2="220" y2="148" stroke-dasharray="3 3"/><line class="l" x1="516" y1="112" x2="516" y2="148" stroke-dasharray="3 3"/><line class="l" x1="664" y1="112" x2="664" y2="148" stroke-dasharray="3 3"/><line class="l" x1="812" y1="112" x2="812" y2="148" stroke-dasharray="3 3"/></g>
</svg>
