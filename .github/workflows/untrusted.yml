# Untrusted workflow: runs on every pull request, including from forks. Read-only token, no secrets, no network
# beyond installing locked dependencies, their pinned Chromium and required system libraries. It runs the whole T1 suite (plan §5.2, TS §17.6).
# The development loop runs TypeScript directly (Node 24+); the shipped bundle must also run on the minimum Node.
name: untrusted
on:
  pull_request:
  push:
    branches: ["**"]
concurrency:
  group: untrusted-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  t1:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit
      - name: SemVer agrees and does not regress from the event base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if test -n "$BASE_SHA" && test "$BASE_SHA" != 0000000000000000000000000000000000000000; then
            previous="$(git show "$BASE_SHA:plugin/plugin.json" | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>console.log(JSON.parse(s).version))')"
            node tools/semver.ts "$previous"
          else
            npm run verify:semver
          fi
      - name: Install the starter's locked Chromium for real browser journeys
        run: |
          browser_tools="$RUNNER_TEMP/tenet-browser-tools"
          mkdir -p "$browser_tools"
          cp plugin/skills/tenet-starter-ts-web-api/template/package.json plugin/skills/tenet-starter-ts-web-api/template/package-lock.json "$browser_tools/"
          npm ci --prefix "$browser_tools" --ignore-scripts --no-audit
          node "$browser_tools/node_modules/@playwright/test/cli.js" install --with-deps chromium
      - name: Isolated native read-only review watcher control
        run: node --test packages/kernel/test/read-only-review.test.ts
      - run: npm run ci
      - name: Capture actual schema-1 lifecycle records (one-shot)
        if: always() && matrix.os == 'ubuntu-latest' && github.event_name == 'push' && contains(github.event.head_commit.message, '[protocol-capture]')
        env:
          SOURCE_COMMIT: ${{ github.event.before }}
        run: |
          capture="$RUNNER_TEMP/tenet-legacy-capture"
          mkdir -p "$capture"
          run_capture() {
            TENET_LEGACY_CAPTURE_DIR="$capture" node --test --test-name-pattern="$2" "$1"
          }
          run_capture packages/kernel/test/branch-admission.test.ts "allows branch creation when only a commit hook exists"
          run_capture packages/kernel/test/workflows.test.ts "leaves the index untouched.*syncs in one step"
          run_capture packages/kernel/test/scaffold.test.ts "writes the template with the project name"
          run_capture packages/kernel/test/dependency.test.ts "resolves without installing, previews what changes"
          run_capture packages/kernel/test/adopt.test.ts "previews first, writes nothing until the user answers"
          run_capture packages/kernel/test/prototype.test.ts "creates and snapshots a hardening inventory when absent"
          run_capture packages/kernel/test/integrate.test.ts "fast-forwards the base, moves the editor"
          run_capture packages/kernel/test/undo.test.ts "previews first and changes nothing"
          run_capture packages/kernel/test/forget-recovery.test.ts "FG-1 clears state|FG-3 finishes after primary damage"
          run_capture packages/kernel/test/project-recovery.test.ts "keeps an adoption linked postcondition unresolved"
          if ! git cat-file -e "$SOURCE_COMMIT^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$SOURCE_COMMIT"
          fi
          node tools/protocol-legacy-capture.mjs "$capture" "$SOURCE_COMMIT"
      - name: The shipped bundle, driven through real repositories
        run: npm run uat
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0
      - name: The shipped bundle, driven through real repositories, on the minimum supported Node
        run: npm run uat
  windows-portability:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run coverage
      - run: npm run build
      - run: npm run verify:payload
      - run: npm run verify:reproducible
      - name: Windows tooling, pure rules, offline evaluation and platform refusal only
        run: >-
          node --test --test-concurrency=4
          packages\eval\test\protocol.test.ts
          packages\eval\test\replay.test.ts
          packages\eval\test\report.test.ts
          packages\kernel\test\tooling-portability.test.ts
          packages\kernel\test\payload.test.ts
          packages\kernel\test\reproducible-build.test.ts
          packages\kernel\test\tools.test.ts
          packages\kernel\test\quality-gate.test.ts
          packages\kernel\test\coverage.test.ts
          packages\kernel\test\platform.test.ts
          packages\kernel\test\host-launch.test.ts
          packages\kernel\test\ci-security.test.ts
          packages\kernel\test\core.test.ts
          packages\kernel\test\config.test.ts
          packages\kernel\test\verdict.test.ts
          packages\kernel\test\report-paths.test.ts
          packages\kernel\test\playwright-adapter.test.ts
          packages\kernel\test\receipts.test.ts
      - name: Windows pure static normalization and report population
        run: >-
          node --test
          --test-name-pattern="static report population and bounds|normalizing typecheck output|normalizing lint output|static receipts|which static checks a contract needs"
          packages\kernel\test\static-conformance.test.ts
          packages\kernel\test\static-checks.test.ts
      - name: Real filesystem cleanup boundaries without POSIX transactions
        run: >-
          node --test --test-name-pattern="automatic temp cleanup boundaries"
          packages\kernel\test\store-boundary.test.ts
      - name: Read-only recovery and pure lesson retirement without POSIX transactions
        run: >-
          node --test --test-name-pattern="interrupted resolution preserves unknown content|repeated lesson retirement"
          packages\kernel\test\dependency.test.ts
          packages\kernel\test\lessons.test.ts
      - name: Review result admission without POSIX transactions
        run: >-
          node --test
          --test-name-pattern="review: one focused recheck|review and analyst reservation roles|carries recorded findings|reuses review completion|requires review follow-up for reported open dependencies|keeps required Deep passes visible|keeps unresolved finding states|requests Deep passes from the latest|keeps an unresolved latest Deep pass|includes each named finding|counts the complete recheck result template|refuses ambiguous attention claims|refuses invalid recheck claims|refuses full-review verification"
          packages\kernel\test\reason-codes.test.ts
          packages\kernel\test\review-admission.test.ts
      - name: Real starter restore and rollback crash prefixes on Node 24
        shell: pwsh
        run: |
          $starter = Join-Path $env:RUNNER_TEMP "tenet-starter-restore"
          New-Item -ItemType Directory -Path $starter -Force | Out-Null
          Get-ChildItem plugin\skills\tenet-starter-ts-web-api\template -Force | Copy-Item -Destination $starter -Recurse -Force
          Set-Location $starter
          npm ci --ignore-scripts --no-audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm rebuild better-sqlite3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-strip-types node_modules\vitest\vitest.mjs run server\test\restore.test.ts server\test\migrate.test.ts server\test\schema-history.test.ts
          exit $LASTEXITCODE
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0
      - name: Windows bounded file identities and payload checks on minimum Node
        run: >-
          node --experimental-strip-types --test
          packages\eval\test\protocol.test.ts
          packages\eval\test\replay.test.ts
          packages\eval\test\report.test.ts
          packages\kernel\test\payload.test.ts
          packages\kernel\test\host-launch.test.ts
          packages\kernel\test\report-paths.test.ts
          packages\kernel\test\playwright-adapter.test.ts
          packages\kernel\test\receipts.test.ts
      - name: Review result admission on minimum Node without POSIX transactions
        run: >-
          node --experimental-strip-types --test
          --test-name-pattern="review: one focused recheck|review and analyst reservation roles|carries recorded findings|reuses review completion|requires review follow-up for reported open dependencies|keeps required Deep passes visible|keeps unresolved finding states|requests Deep passes from the latest|keeps an unresolved latest Deep pass|includes each named finding|counts the complete recheck result template|refuses ambiguous attention claims|refuses invalid recheck claims|refuses full-review verification"
          packages\kernel\test\reason-codes.test.ts
          packages\kernel\test\review-admission.test.ts
      - name: Real starter restore and rollback crash prefixes on minimum Node
        shell: pwsh
        run: |
          $starter = Join-Path $env:RUNNER_TEMP "tenet-starter-restore"
          Set-Location $starter
          npm rebuild better-sqlite3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-strip-types node_modules\vitest\vitest.mjs run server\test\restore.test.ts server\test\migrate.test.ts server\test\schema-history.test.ts
          exit $LASTEXITCODE
