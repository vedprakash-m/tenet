# Temporary: CPU and Git profile of the warm bookkeeping calls that miss NFR-01. Removed once read.
name: profile-temp
on:
  push:
    branches: [main]
    paths: [tools/bench-profile.ts, .github/workflows/profile-temp.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run build
      - run: node tools/bench-profile.ts "$PWD/plugin/kernel/tenet.mjs" "$RUNNER_TEMP/profile"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: profile
          path: |
            ${{ runner.temp }}/profile/summary.txt
            ${{ runner.temp }}/profile/*/*.cpuprofile
          retention-days: 7
