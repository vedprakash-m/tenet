# Temporary (NFR-01 work): CPU profile of the current bundle, and paired timings of each change against its parent on one
# runner. Removed when done.
name: perf-temp
on:
  push:
    branches: ["claude/nfr01-speed-*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: perf-temp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run build
      - run: node tools/bench-profile.ts "$PWD/plugin/kernel/tenet.mjs" "$RUNNER_TEMP/profile"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: profile
          path: |
            ${{ runner.temp }}/profile/summary.txt
            ${{ runner.temp }}/profile/*/*.cpuprofile
          retention-days: 7
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pair:
          - { name: same-same, base: ab80f4718, candidate: ab80f4718 }
          - { name: unique-keys, base: e03ccaa5b, candidate: 2f1d6f1b4 }
          - { name: no-locales, base: 2f1d6f1b4, candidate: d3ef87215 }
          - { name: jitless, base: d3ef87215, candidate: c9ad6f767 }
          - { name: main-vs-tip, base: ab80f4718, candidate: HEAD }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit
      - name: Build both bundles
        run: |
          for arm in base candidate; do
            ref=${{ matrix.pair.base }}; [ $arm = candidate ] && ref=${{ matrix.pair.candidate }}
            git worktree add --detach "$RUNNER_TEMP/$arm" "$ref"
            npm ci --prefix "$RUNNER_TEMP/$arm" --ignore-scripts --no-audit
            npm run build --prefix "$RUNNER_TEMP/$arm"
            cp "$RUNNER_TEMP/$arm/plugin/kernel/tenet.mjs" "$RUNNER_TEMP/$arm.mjs"
          done
      - run: node tools/bench-pair.ts "$RUNNER_TEMP/base.mjs" "$RUNNER_TEMP/candidate.mjs" 3 | tee pair.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: paired-${{ matrix.pair.name }}
          path: pair.log
          retention-days: 7
