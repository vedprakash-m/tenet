name: CI

# Private-repository minutes are metered (macOS counts 10x, Windows 2x), so:
# pull requests run Linux and Windows; macOS runs once per merge to main or on demand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest","windows-latest"]') || fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Lockfile uses the public npm registry
        shell: bash
        run: |
          if grep -E '"resolved": "https?://' package-lock.json | grep -v '"resolved": "https://registry.npmjs.org/'; then
            echo "package-lock.json resolves packages from a private registry; rewrite them to https://registry.npmjs.org/"; exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run check:examples