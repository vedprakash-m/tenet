# CANDIDATE release workflow (PRD §5.9.2, TS §18 item 3, ENG-07). It has never run: branch protection, tag signing, attestation,
# the `release` environment and the pinned actions' inputs are all unobserved. Nothing here authorizes a release or publication;
# the last job creates a DRAFT release that the owner publishes by hand. Design: docs/release/release-verification.md.
# Triggers on a version tag only, never on a pull request, so it holds no untrusted code. Each job asks for the least token it needs.
name: release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions: {}
env:
  TAG: ${{ github.ref_name }}
jobs:
  gate:
    # Reviewed source: the tagged commit is on the protected default branch, the tag is annotated and signed, CI passed there,
    # the tag matches the shipped version, the notes are written, and every due Must is qualified (this last check fails today).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: The tagged commit is on the protected default branch
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: The tag is annotated and GitHub verifies its signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.type)" = tag
          tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq .verification.verified)" = true
      - name: The untrusted workflow passed on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/untrusted.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq .total_count)"
          test "$passed" -ge 1
      - run: npm ci --ignore-scripts --no-audit
      - name: The tag names the shipped version
        run: test "$TAG" = "v$(node -p "require('./plugin/plugin.json').version")"
      - name: Release notes cover every disclosure item
        run: node tools/release-notes.ts --check "docs/release/notes/$TAG.md"
      - name: Every due Must is qualified on one tuple and artifact
        run: node tools/release-audit.ts --milestone R1
  build:
    # Build inputs and produced artifact: locked dependencies, one payload, a reproducible double build, then a provenance
    # attestation over the packed payload. The attestation step needs the OIDC token; no other job holds it.
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run build
      - run: npm run verify:payload
      - run: npm run verify:reproducible
      - name: Pack the payload deterministically
        run: |
          mkdir dist
          name="tenet-plugin-$TAG.tgz"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -cf - -C plugin . | gzip -n > "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
  publish:
    # Published artifact: verify the attestation of the exact file, then create a draft release. Release credentials sit in a
    # protected environment (required reviewers, set in repository settings) and in no other job.
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - name: The downloaded payload verifies against its attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum -c "tenet-plugin-$TAG.tgz.sha256")
          gh attestation verify "dist/tenet-plugin-$TAG.tgz" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
      - name: Create a draft release for the owner to publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/* --verify-tag --draft --title "Tenet $TAG" --notes-file "docs/release/notes/$TAG.md"
