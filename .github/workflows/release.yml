name: Release package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          TENET_RELEASE_TARBALL_DIR: ${{ runner.temp }}/tenet-package
      - name: Record the tarball digest
        working-directory: ${{ runner.temp }}/tenet-package
        run: sha256sum ./*.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: tenet-release-package
          path: ${{ runner.temp }}/tenet-package/
          if-no-files-found: error

  packed-journey:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: tenet-release-package
          path: ${{ runner.temp }}/tenet-package
      - run: node --experimental-strip-types --test test/release/packed.test.ts
        env:
          TENET_RELEASE_PACKED_DIR: ${{ runner.temp }}/tenet-package
