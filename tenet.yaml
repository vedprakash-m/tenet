# Tenet's own policy: this repository runs under the standard it defines (PRD DEC-08).
# Applied from CP-0015's proposal after CP-0003 bootstrap (L-0032). The previous file is archived
# at tenet/archive/tenet.yaml@0.1.0-draft.yaml.
standard: "~0.1.0-alpha.0"
kit_path: kit
paths: {records: tenet}
level: observe
owners:
  - {id: ved, name: Ved, roles: [owner], keys: [], forge_accounts: [vedprakash-m]}
specs: {id_prefix: R}
stop: {failing_evaluations: 3}
checks:
  lint: {setup: [npm ci], run: npm run lint, report: none}
  test:
    setup: [npm ci, npm run build]
    run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=.tenet/reports/test.xml "test/**/*.test.ts"
    report: junit
