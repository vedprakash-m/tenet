# Tenet's own policy: this repository runs under the standard it defines (PRD DEC-08).
# Applied from CP-0015's proposal after CP-0003 bootstrap (L-0032). The previous file is archived
# at tenet/archive/tenet.yaml@0.1.0-draft.yaml.
standard: "~0.1.0-alpha.0"
kit_path: kit
paths: {records: tenet}
level: observe
owners:
  - {id: ved, name: Ved, roles: [owner], keys: [], forge_accounts: [vedprakash-m]}
specs:
  id_prefix: R
  documents:
    - {path: vision.md, level: L0}
    - {path: specs/prd.md, level: L1}
    - {path: specs/prd/catalog.md, level: L1}
    - {path: specs/prd/decisions.md, level: L1}
    - {path: specs/prd/tooling.md, level: L1}
    - {path: specs/tech-spec.md, level: L2}
    - {path: specs/tech-spec/agents.md, level: L2}
    - {path: specs/tech-spec/algorithms.md, level: L2}
    - {path: specs/tech-spec/ci.md, level: L2}
    - {path: specs/tech-spec/contracts.md, level: L2}
    - {path: specs/tech-spec/evidence.md, level: L2}
    - {path: specs/tech-spec/health.md, level: L2}
    - {path: specs/tech-spec/kernel.md, level: L2}
    - {path: specs/tech-spec/mcp.md, level: L2}
    - {path: specs/tech-spec/messages.md, level: L2}
    - {path: specs/tech-spec/onboarding.md, level: L2}
    - {path: specs/ux-spec.md, level: L2}
    - {path: specs/plan.md, level: L2}
    - {path: specs/plan/0.1.0.md, level: L2}
    - {path: specs/plan/0.1.x.md, level: L2}
    - {path: specs/plan/alpha.0.md, level: L2}
    - {path: specs/plan/alpha.0b.md, level: L2}
    - {path: specs/plan/alpha.1.md, level: L2}
    - {path: specs/plan/alpha.2.md, level: L2}
stop: {failing_evaluations: 3}
checks:
  lint: {setup: [npm ci], run: npm run lint, report: none}
  test:
    setup: [npm ci, npm run build]
    run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=.tenet/reports/test.xml "test/**/*.test.ts"
    report: junit
