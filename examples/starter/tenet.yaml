standard: ~0.1
paths:
  records: tenet
level: observe
specs:
  id_prefix: R
  documents:
    - path: tenet/vision.md
      level: L0
    - path: tenet/specs/prd.md
      level: L1
    - path: tenet/specs/tech-spec.md
      level: L2
    - path: tenet/specs/ux-spec.md
      level: L2
    - path: tenet/specs/plan.md
      level: L2
owners:
  - id: ved
    name: Ved
    roles:
      - owner
checks:
  test:
    setup: []
    run: npm test
    report: none
    report_from: file
ci:
  mode: tenet-workflow
  test_workflow: .github/workflows/tenet-tests.yml
stop:
  failing_evaluations: 3
agents:
  working_rules: default
protect:
  - .github/workflows/tenet.yml
  - .github/workflows/tenet-tests.yml
  - tenet.yaml
  - tenet.lock
  - CODEOWNERS
