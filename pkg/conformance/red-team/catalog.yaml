    packet: "CP-0018, CP-0051, CP-0021"
    release: "alpha.0 reporting, alpha.2 conditional gate"
    fixture:
      setup: "two mapped case identities and one result"
      challenge: "omit the second result from the fixture report"
      expected: "show not run and give no passing credit to the missing case"
  - id: RT-022
    threat: "A skip is added to a test"
    guarantee: {observe: "advisory", protect: "detected", verify: "enforced*", assure: "enforced*"}
    control: "ALG-09, tests-not-weakened"
    packet: "CP-0018, CP-0050, CP-0021"
    release: "alpha.0 reporting, alpha.2 conditional gate"
    fixture:
      setup: "a protected tracked test pair with trusted baseline; an unprotected variant checks detection only"
      challenge: "report a newly skipped case in the proposed diff"
      expected: "report the skip and enforce only for the protected case when the binding qualifies; otherwise report detection"
  - id: RT-023
    threat: "A test is special-cased to pass without testing its claim"
    guarantee: {observe: "as-host-declares-or-limited", protect: "as-host-declares-or-limited", verify: "as-host-declares-or-limited", assure: "as-host-declares-or-limited"}
    control: "R-172 distinguishing, independent checks"
    packet: "CP-0021; CP-0020 for distinguishing checks"
    release: "alpha.2 case; 0.1.0 independent checks"
    fixture:
      setup: "a synthetic ineffective test and an independent case"
      challenge: "supply a passing result for the ineffective test"
      expected: "report the contradiction where observed and withhold independent credit"
  - id: RT-024
    threat: "A proving test disappears"
    guarantee: {observe: "advisory", protect: "detected", verify: "enforced*", assure: "enforced*"}
    control: "ALG-09, R-103"
    packet: "CP-0018, CP-0050, CP-0021"
    release: "alpha.0 reporting, alpha.2 conditional gate"
    fixture:
      setup: "a protected expected proving case and base revision; an unprotected variant checks detection only"
      challenge: "submit fixture results and change summary without the test"
      expected: "report removal; enforce review or evidence for the protected case where the binding qualifies; otherwise report detection"
  - id: RT-025
    threat: "Report is substituted for a different check run"
    guarantee: {observe: "advisory", protect: "detected", verify: "enforced*", assure: "enforced*"}
    control: "R-100 bundle and check identity"
    packet: "CP-0051, CP-0046, CP-0021"
    release: "alpha.0 shape and source check, alpha.2 conditional gate"
    fixture:
      setup: "pinned report from a specific check"
      challenge: "offer a report labelled for a different check result"
      expected: "reject the mismatch and report incomplete evidence"
  - id: RT-026
    threat: "Unexpected test hook changes the check's behavior"
    guarantee: {observe: "as-host-declares-or-limited", protect: "as-host-declares-or-limited", verify: "as-host-declares-or-limited", assure: "as-host-declares-or-limited"}
    control: "R-103 protected surfaces and R-172 distinguishing"
    packet: "CP-0021; CP-0020 for independent checks"
    release: "alpha.2 case; 0.1.0 independent checks"
    fixture:
      setup: "trusted check configuration and a fixture recording changed behavior"
      challenge: "offer the modified invocation as ordinary evidence"
      expected: "flag a protected change where covered and surface discrepancies from independent checks"
  - id: RT-027
    threat: "Baseline runner fails before the case is tested"
    guarantee: {observe: "unavailable", protect: "unavailable", verify: "detected", assure: "detected"}
    control: "R-172 harness failure is inconclusive"
    packet: "CP-0021; CP-0020 for full deliberate baseline"
    release: "alpha.2 case; 0.1.0 distinguishing checks"
    fixture:
      setup: "baseline and candidate with a synthetic baseline infrastructure failure"
      challenge: "classify the baseline failure as a distinguishing result"
      expected: "record inconclusive and give it no distinguishing credit"
  - id: RT-028
    threat: "A continuing promise is dropped after its approval"
    guarantee: {observe: "advisory", protect: "detected", verify: "enforced*", assure: "enforced*"}
    control: "R-170, R-187 continuing claims and defeaters"
    packet: "CP-0043, CP-0021 milestone mapping"
    release: "0.1.x"
    fixture:
      setup: "a continuing promise and later contrary evidence"
      challenge: "submit a view omitting the still-active claim"
      expected: "restore the visible obligation and apply the gate covering it"
  - id: RT-029
    threat: "A quarantine is hidden or outlives its expiry"
    guarantee: {observe: "advisory", protect: "detected", verify: "enforced*", assure: "enforced*"}
    control: "R-153 quarantine with expiry"
    packet: "CP-0035, CP-0021 milestone mapping"
    release: "0.1.x"
    fixture:
      setup: "a recorded quarantine with expiry and mapped obligations"
      challenge: "omit the unexpired quarantine from a candidate view, then evaluate beyond expiry without replacement evidence"
      expected: "show the quarantine despite omission while active; after expiry require renewed evidence"
  - id: RT-030
    threat: "Proof relies on an unapproved assumption or escape hatch"
    guarantee: {observe: "advisory", protect: "detected", verify: "enforced*", assure: "enforced*"}
    control: "R-179 theorem hash and proof audit"
    packet: "CP-0021 milestone mapping; M2 proof proving packet pending"
    release: "M2"
    fixture:
      setup: "a theorem and permitted assumptions fixture"
      challenge: "submit proof metadata with an unapproved assumption"
      expected: "refuse the proof credit and identify the undischarged obligation"
  - id: RT-031
    threat: "An unapproved skill revision is loaded"
    guarantee: {observe: "advisory", protect: "detected", verify: "detected", assure: "detected"}
    control: "R-017 pinned skills and agent packet review"
    packet: "CP-0012, CP-0022; CP-0021 coverage reconciliation"
    release: "alpha.0 pin, 0.1.0 card checks"
    fixture:
      setup: "a pinned skill and an unexpected revision"
      challenge: "offer a different digest for the selected skill"
      expected: "report the mismatch at the binding's observed strength"
