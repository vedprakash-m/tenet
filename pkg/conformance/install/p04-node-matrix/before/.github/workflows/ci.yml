name: Checkout CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - id: tests
        run: npx vitest run --reporter=junit --outputFile.junit=artifacts/unit.xml
